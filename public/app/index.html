<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="عبمبر الزروق" />
    <title>منيو حلويات عبمبر الزروق</title>
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/app/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/app/favicon.ico" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <link rel="manifest" href="/app/manifest.json" />
    <script>
      // Boot-time shop/view detection.
      // Responsibilities: (1) detect shop intent, (2) persist to sessionStorage,
      // (3) set manifest/icon/title for iOS "Add to Home Screen".
      // This script MUST NOT manipulate window.location or the hash — Vue Router owns routing.
      (function() {
        try {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var path = window.location.pathname || '';
          var ss = window.sessionStorage;

          // Priority: explicit URL query > hash hint > sessionStorage > default
          var isAdmin = false;
          var isShop2 = false;

          // 1. Explicit query string (?shop=shop2, ?view=admin) — highest priority
          if (search.indexOf('view=admin') !== -1 || search.indexOf('mode=admin') !== -1 || path.indexOf('/admin') !== -1) {
            isAdmin = true;
          } else if (search.indexOf('shop=shop2') !== -1) {
            isShop2 = true;
          }
          // 2. Hash hint (from in-app navigation or old bookmarks)
          else if (hash.indexOf('admin') !== -1) {
            isAdmin = true;
          } else if (hash.indexOf('shop2') !== -1) {
            isShop2 = true;
          }
          // 3. sessionStorage (persisted from a previous page load in this PWA instance)
          else if (ss) {
            var saved = ss.getItem('emenu_view');
            if (saved === 'admin') isAdmin = true;
            else if (saved === 'shop2') isShop2 = true;
          }

          // Persist to sessionStorage so Vue router and store can read it
          if (ss) {
            if (isAdmin) ss.setItem('emenu_view', 'admin');
            else if (isShop2) ss.setItem('emenu_view', 'shop2');
            else ss.setItem('emenu_view', 'shop1');
          }

          // Set manifest, icon, title for iOS "Add to Home Screen"
          var linkManifest = document.querySelector('link[rel="manifest"]');
          var linkAppleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          var metaAppleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');

          if (isAdmin) {
            document.title = 'لوحة إدارة عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest-admin.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-admin.png');
            if (metaAppleTitle) metaAppleTitle.setAttribute('content', 'إدارة الزروق');
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#0f172a');
          } else if (isShop2) {
            document.title = 'قسم النواشف - حلويات عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest-shop2.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-shop2.png');
            if (metaAppleTitle) metaAppleTitle.setAttribute('content', 'قسم النواشف');
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#f7f3ec');
          } else {
            document.title = 'منيو حلويات عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-shop1.png');
            if (metaAppleTitle) metaAppleTitle.setAttribute('content', 'عبمبر الزروق');
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#f7f3ec');
          }
        } catch (e) {}
      })();
    </script>
