    <script>
      (function() {
        try {
          var search = window.location.search || '';

          var isAdmin = hash.indexOf('admin') !== -1 || search.indexOf('view=admin') !== -1 || search.indexOf('mode=admin') !== -1 || path.indexOf('/admin') !== -1;
          var isShop2 = hash.indexOf('shop2') !== -1 || search.indexOf('shop=shop2') !== -1 || path.indexOf('/shop2') !== -1;

          var linkManifest = document.querySelector('link[rel="manifest"]');
          var linkAppleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          var metaAppleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');

          if (isAdmin) {
            document.title = 'لوحة إدارة عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest-admin.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-admin.png');
            if (metaAppleTitle) metaAppleTitle.setAttribute('content', 'إدارة الزروق');
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#0f172a');
            if (!hash || hash === '#/' || hash === '#') {
              window.location.hash = '#/admin';
            }
          } else if (isShop2) {
            document.title = 'قسم النواشف - حلويات عبمبر الزروق';

            if (metaThemeColor) metaThemeColor.setAttribute('content', '#f7f3ec');
            if (!hash || hash === '#/' || hash === '#') {
              window.location.hash = '#/shop/shop2';
            }
          } else {
            document.title = 'منيو حلويات عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-shop1.png');
