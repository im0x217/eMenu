    <title>منيو حلويات عبمبر الزروق</title>
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/app/favicon.ico" />

    <script>
      (function() {
        try {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var path = window.location.pathname || '';
          var isAdmin = hash.indexOf('admin') !== -1 || search.indexOf('view=admin') !== -1 || search.indexOf('mode=admin') !== -1 || path.indexOf('/admin') !== -1;
          if (isAdmin) {
            document.title = 'لوحة إدارة عبمبر الزروق';
            var link = document.querySelector('link[rel="manifest"]');
            if (link) link.setAttribute('href', '/manifest-admin.json');
            var metaTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (metaTitle) metaTitle.setAttribute('content', 'إدارة الزروق');
            var themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute('content', '#0f172a');
            if (!hash || hash === '#/' || hash === '#') {
              window.location.hash = '#/admin';
            }
          }
        } catch (e) {}
      })();
    </script>
