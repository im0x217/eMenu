<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>حلويات عبمبر الزروق</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#fdb518" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      crossorigin="anonymous"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        background-color: #0c0603;
        background-image: 
          radial-gradient(circle at 20% 20%, rgba(253, 181, 24, 0.08) 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(139, 69, 19, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, #150a05 0%, #080301 100%);
        background-attachment: fixed;
        min-height: 100vh;
        direction: rtl;
        text-align: right;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        font-family: 'Cairo', sans-serif;
        padding: 2rem;
        position: relative;
        overflow-x: hidden;
      }

      /* Glowing background elements */
      .glow-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        z-index: 0;
        pointer-events: none;
        opacity: 0.5;
        animation: orbFloat 15s ease-in-out infinite alternate;
      }
      .orb-1 {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(253, 181, 24, 0.15) 0%, transparent 70%);
        top: -50px;
        left: -50px;
      }
      .orb-2 {
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, rgba(139, 69, 19, 0.25) 0%, transparent 70%);
        bottom: -100px;
        right: -100px;
        animation-delay: -5s;
      }

      @keyframes orbFloat {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(40px, 30px) scale(1.1);
        }
      }

      .landing-container {
        max-width: 900px;
        width: 100%;
        z-index: 10;
        margin: auto;
      }

      .header-section {
        text-align: center;
        margin-bottom: 3.5rem;
        animation: fadeInDown 0.8s ease-out;
      }

      .logo-section {
        margin-bottom: 1.5rem;
        position: relative;
        display: inline-block;
      }

      .logo-ring {
        position: absolute;
        top: -8px;
        left: -8px;
        right: -8px;
        bottom: -8px;
        border: 2px dashed rgba(253, 181, 24, 0.3);
        border-radius: 50%;
        animation: rotateRing 20s linear infinite;
      }

      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .navbar-logo {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.05);
        object-fit: cover;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
        background: #1a0f0a;
        position: relative;
        z-index: 2;
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .logo-section:hover .navbar-logo {
        transform: rotate(360deg) scale(1.05);
        border-color: rgba(253, 181, 24, 0.5);
        box-shadow: 0 15px 45px rgba(253, 181, 24, 0.2);
      }

      .header-section h1 {
        font-size: 2.8rem;
        font-weight: 900;
        background: linear-gradient(135deg, #ffffff 40%, #fdb518 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        margin-top: 1.5rem;
        letter-spacing: -0.5px;
      }

      .header-section p {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.65);
        margin-top: 0.5rem;
        letter-spacing: 0.5px;
      }

      .categories-section {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
        gap: 2rem;
        width: 100%;
        margin-bottom: 2rem;
      }

      .category-link {
        text-decoration: none !important;
        color: inherit;
        outline: none;
      }

      .category-card {
        width: 100%;
        height: 270px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 28px;
        padding: 2.5rem;
        text-align: center;
        position: relative;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        cursor: pointer;
        animation: fadeInUp 0.8s ease-out;
      }

      /* Glowing inner border effect */
      .category-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        border-radius: 28px;
        padding: 2px;
        background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(253, 181, 24, 0.1) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
        transition: all 0.5s ease;
      }

      /* Hover states */
      .category-card:hover {
        transform: translateY(-10px);
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(253, 181, 24, 0.2);
        box-shadow: 
          0 20px 40px rgba(0, 0, 0, 0.5), 
          0 0 25px rgba(253, 181, 24, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .category-card:hover::before {
        background: linear-gradient(135deg, rgba(253, 181, 24, 0.5) 0%, transparent 50%, rgba(253, 181, 24, 0.3) 100%);
      }

      /* Card themes */
      .theme-yellow:hover {
        border-color: rgba(253, 181, 24, 0.3);
      }
      .theme-blue:hover {
        border-color: rgba(30, 58, 95, 0.5);
      }

      .card-icon {
        font-size: 3.8rem;
        margin-bottom: 1.2rem;
        display: inline-block;
        transition: transform 0.4s ease;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
      }

      .category-card:hover .card-icon {
        transform: scale(1.15) rotate(5deg);
      }

      .card-title {
        font-size: 1.6rem;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 0.6rem;
        letter-spacing: -0.2px;
      }

      .card-description {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.5);
        line-height: 1.5;
      }

      .category-card:hover .card-description {
        color: rgba(255, 255, 255, 0.8);
      }

      /* Animations */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .category-link:nth-child(2) .category-card {
        animation-delay: 0.15s;
      }

      /* Footer */
      footer {
        position: relative;
        z-index: 10;
        margin-top: 4rem;
        padding: 1.5rem;
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 20px;
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.9rem;
      }

      footer a {
        color: #fdb518;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
      }

      footer a:hover {
        color: #ffe066;
        text-decoration: underline !important;
      }

      /* Responsive styling */
      @media (max-width: 768px) {
        body {
          padding: 1.5rem 1rem;
        }

        .header-section h1 {
          font-size: 2.2rem;
        }

        .header-section p {
          font-size: 1.1rem;
        }

        .navbar-logo {
          width: 120px;
          height: 120px;
        }

        .categories-section {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }

        .category-card {
          height: 230px;
          padding: 2rem;
        }

        .card-icon {
          font-size: 3.2rem;
        }

        .card-title {
          font-size: 1.4rem;
        }
      }

      @media (max-width: 480px) {
        .header-section {
          margin-bottom: 2.5rem;
        }

        .header-section h1 {
          font-size: 1.8rem;
        }

        .header-section p {
          font-size: 1rem;
        }

        .navbar-logo {
          width: 100px;
          height: 100px;
        }

        footer {
          flex-direction: column;
          gap: 0.25rem;
          font-size: 0.85rem;
          margin-top: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Orbs Wrapper to prevent iOS Zoom Out -->
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 0;">
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
    </div>

    <div class="landing-container">
      <div class="header-section">
        <div class="logo-section">
          <div class="logo-ring"></div>
          <img src="res/logo.jpg" alt="Logo" class="navbar-logo" />
        </div>
        <h1>حلويات عبمبر الزروق</h1>
        <p>مرحباً بكم، اختر وجهتك لتصفح المنيو</p>
      </div>

      <div class="categories-section">
        <!-- Main Website Button (Yellow Theme) -->
        <a href="/app/?shop=shop1" class="category-link">
          <div class="category-card theme-yellow">
            <div class="card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fdb518" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/>
                <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/>
                <path d="M2 21h20"/>
                <line x1="12" y1="7" x2="12" y2="11"/>
              </svg>
            </div>
            <div class="card-title">المتجر الرئيسي</div>
            <div class="card-description">تصفح جميع المنتجات، الجاتوهات، والحلويات الشرقية والغربية</div>
          </div>
        </a>

        <!-- Blue Shop Button (Blue Theme) -->
        <a href="/app/?shop=shop2" class="category-link">
          <div class="category-card theme-blue">
            <div class="card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#5a9bf6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="m18 15-6-6-6 6"/>
                <path d="M12 3v6"/>
                <circle cx="12" cy="17" r="5"/>
              </svg>
            </div>
            <div class="card-title">قسم النواشف</div>
            <div class="card-description">تصفح أصناف النواشف، الكعك، الغريبة، القرينات والمالح</div>
          </div>
        </a>
      </div>
    </div>

    <footer>
      <span>&copy; 2026 حلويات عبمبر الزروق &mdash; جميع الحقوق محفوظة.</span>
      <span>تصميم وتطوير بواسطة <a href="LICENSE" target="_blank">مهند الزروق</a></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully:', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
