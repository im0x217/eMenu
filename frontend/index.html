<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="عبمبر الزروق" />
    <title>منيو حلويات عبمبر الزروق</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var path = window.location.pathname || '';

          // Detect intent from URL query string (?shop=shop2, ?view=admin)
          var hasExplicitAdmin = search.indexOf('view=admin') !== -1 || search.indexOf('mode=admin') !== -1 || path.indexOf('/admin') !== -1;
          var hasExplicitShop2 = search.indexOf('shop=shop2') !== -1;

          // Also detect from existing hash (covers in-app navigation AND malformed shortcut hashes like #/shop2)
          var hashHasShop2 = hash.indexOf('shop2') !== -1;
          var hashHasAdmin = hash.indexOf('admin') !== -1;
          var isAdmin = hasExplicitAdmin || hashHasAdmin;
          var isShop2 = !isAdmin && (hasExplicitShop2 || hashHasShop2);

          // Check if hash already has the correct full route
          var hashAlreadyCorrect = (isAdmin && hash === '#/admin') ||
                                    (isShop2 && hash === '#/shop/shop2') ||
                                    (!isAdmin && !isShop2 && hash === '#/shop/shop1');

          var linkManifest = document.querySelector('link[rel="manifest"]');
          var linkAppleIcon = document.querySelector('link[rel="apple-touch-icon"]');
          var metaAppleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          var metaThemeColor = document.querySelector('meta[name="theme-color"]');

          if (isAdmin) {
            document.title = 'لوحة إدارة عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest-admin.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-admin.png');
            if (metaAppleTitle) metaAppleTitle.setAttribute('content', 'إدارة الزروق');
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#0f172a');
            if (!hashAlreadyCorrect) {
              window.location.replace(path + search + '#/admin');
            }
          } else if (isShop2) {
            document.title = 'قسم النواشف - حلويات عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest-shop2.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-shop2.png');
            if (metaAppleTitle) metaAppleTitle.setAttribute('content', 'قسم النواشف');
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#f7f3ec');
            // Force correct hash for ANY shop2 intent (explicit query OR hash like #/shop2)
            if (!hashAlreadyCorrect) {
              window.location.replace(path + search + '#/shop/shop2');
            }
          } else {
            document.title = 'منيو حلويات عبمبر الزروق';
            if (linkManifest) linkManifest.setAttribute('href', '/manifest.json');
            if (linkAppleIcon) linkAppleIcon.setAttribute('href', '/apple-touch-icon-shop1.png');
            if (metaAppleTitle) metaAppleTitle.setAttribute('content', 'عبمبر الزروق');
            if (metaThemeColor) metaThemeColor.setAttribute('content', '#f7f3ec');
            if (!hash || hash === '#/' || hash === '#') {
              window.location.replace(path + search + '#/shop/shop1');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
