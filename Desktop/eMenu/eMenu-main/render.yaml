services:
  - type: web
    name: e-menu
    env: node
    plan: free
    # Project files are inside the `eMenu-main` subfolder. Ensure Render runs
    # commands from that folder so `package.json` can be found.
    buildCommand: cd eMenu-main && npm install
    startCommand: cd eMenu-main && node server.js
    envVars:
      - fromGroup: e-menu-secrets
